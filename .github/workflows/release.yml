name: Release skill zips

# Runs only when a version tag is pushed (for example v0.2.0): attaches one zip per
# skill to the GitHub release, for claude.ai users to upload. The CI checks run
# first, from ci.yml itself, and the release waits for them to pass.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zips
        run: bash scripts/build-zips.sh dist
      - name: Create the release with the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes
